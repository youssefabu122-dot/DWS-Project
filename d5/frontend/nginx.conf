server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # D9 (XSS defence in depth): only scripts and styles from this origin may run;
    # inline scripts and event handlers are blocked; requests may only go to the API.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' http://localhost:3001; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    location / { try_files $uri $uri/ /index.html; }
}
