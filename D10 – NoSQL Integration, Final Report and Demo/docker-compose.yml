name: rosca-d5
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Copy .env.example to .env first}
      MYSQL_DATABASE: d2_test
      MYSQL_USER: rosca
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Copy .env.example to .env first}
      TZ: UTC
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u rosca -D d2_test -e "SELECT COUNT(*) FROM DiscountShare" >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  # D10: applies database/migrations to new AND existing volumes (idempotent), as root,
  # because the app account has no CREATE privilege (D9 least privilege).
  db-migrate:
    image: mysql:8.4
    environment:
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD:?Copy .env.example to .env first}
    volumes:
      - ./database/migrations:/migrations:ro
    entrypoint: ["sh", "-c", "for f in /migrations/*.sql; do echo \"apply $$f\"; mysql -h db -u root d2_test < \"$$f\" || exit 1; done"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
  # D10: document store for the activity feed (MySQL stays the financial ledger).
  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env (see .env.example)}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in .env (see .env.example)}
      TZ: UTC
    ports:
      - "127.0.0.1:${MONGO_HOST_PORT:-27018}:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", 'mongosh --quiet -u rosca_feed -p "$$MONGO_APP_PASSWORD" --authenticationDatabase rosca_feed rosca_feed --eval "db.activity_events.findOne()" >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
  backend:
    build: ./backend
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: rosca
      DB_PASSWORD: ${MYSQL_PASSWORD:?Copy .env.example to .env first}
      DB_NAME: d2_test
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_USER: rosca_feed
      MONGO_PASSWORD: ${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in .env (see .env.example)}
      MONGO_DB: rosca_feed
      OUTBOX_INTERVAL_MS: 1000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      BID_DURATION_MINUTES: 30
      BID_SCAN_INTERVAL_MS: 1000
      TZ: UTC
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-3001}:3000"
    depends_on:
      db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/circles').then(r=>process.exit(r.status===401?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  mysql_data:
  mongo_data:
